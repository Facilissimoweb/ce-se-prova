    <script>
      // Patch anti-crash per Google Translate (React issue #11538)
      // Google Translate sostituisce i nodi di testo del DOM con tag <font>,
      // rompendo i riferimenti che React tiene ai nodi. Questa patch rende
      // removeChild e insertBefore tolleranti a nodi orfani, prevenendo il crash.
      (function () {
        if (typeof Node !== 'function' || !Node.prototype) return;

        const originalRemoveChild = Node.prototype.removeChild;
        Node.prototype.removeChild = function (child) {
          if (child.parentNode !== this) {
            console.warn('[gtranslate-patch] removeChild saltato: nodo non figlio (DOM modificato da Google Translate)');
            return child;
          }
          return originalRemoveChild.apply(this, arguments);
        };

        const originalInsertBefore = Node.prototype.insertBefore;
        Node.prototype.insertBefore = function (newNode, referenceNode) {
          if (referenceNode && referenceNode.parentNode !== this) {
            console.warn('[gtranslate-patch] insertBefore saltato: nodo di riferimento non figlio (DOM modificato da Google Translate)');
            return newNode;
          }
          return originalInsertBefore.apply(this, arguments);
        };
      })();
    </script>
