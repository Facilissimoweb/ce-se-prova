<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Tarot Italia — Auth</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #1c1917;
        --muted: #57534e;
        --bg: #fafaf9;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
        font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia,
          serif;
        background:
          radial-gradient(ellipse at top, #f5f0e8 0%, transparent 55%),
          linear-gradient(160deg, #fafaf9 0%, #eee8df 100%);
        color: var(--ink);
      }
      main {
        max-width: 28rem;
        text-align: center;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.75rem;
        font-weight: 600;
        letter-spacing: 0.02em;
      }
      p {
        margin: 0;
        color: var(--muted);
        font-size: 1rem;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Tarot Italia</h1>
      <p>
        Dominio Auth per Google Sign-In. Il sito pubblico resta su
        www.tarotitalia.com.
      </p>
    </main>
  </body>
</html>
